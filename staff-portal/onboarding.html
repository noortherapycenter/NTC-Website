<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Onboarding — Admin Portal — Noor Therapy Center</title>
<link rel="icon" href="../favicon.ico" sizes="any"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal.css"/>
<script src="portal.js" data-root=".."></script>
<style>
  .manual { display: grid; grid-template-columns: 292px 1fr; gap: 28px; align-items: start; }

  /* ---- Nav tree (matches Policies / Handbook) ---- */
  .nav-tree {
    position: sticky; top: 82px;
    max-height: calc(100vh - 106px); overflow-y: auto;
    background: #fff; border: 1.5px solid var(--line); border-radius: 16px;
    padding: 10px 12px 16px;
  }
  .nav-group + .nav-group { margin-top: 4px; }
  .nav-group > button {
    width: 100%; display: flex; align-items: center; gap: 8px;
    border: none; background: none; cursor: pointer; text-align: left;
    font-family: inherit; font-size: 10.5px; font-weight: 800;
    letter-spacing: 0.13em; text-transform: uppercase; color: var(--muted);
    padding: 9px 8px 7px; border-radius: 8px;
  }
  .nav-group > button:hover { color: var(--ink); }
  .nav-group > button .dot { width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0; }
  .nav-group > button .chev { margin-left: auto; transition: transform .15s ease; }
  .nav-group.open > button .chev { transform: rotate(90deg); }
  .nav-group ul { list-style: none; margin: 0; padding: 0 0 4px; display: none; }
  .nav-group.open ul { display: block; }
  .nav-group li a {
    display: flex; align-items: baseline; gap: 8px;
    padding: 7.5px 8px 7.5px 10px; margin: 1px 0 1px 6px;
    border-left: 2px solid var(--line); border-radius: 0 8px 8px 0;
    text-decoration: none; color: var(--muted);
    font-size: 12.5px; font-weight: 600; line-height: 1.35;
  }
  .nav-group li a .num { font-size: 10px; font-weight: 800; color: var(--muted); opacity: .75; flex-shrink: 0; width: 26px; }
  .nav-group li a:hover { color: var(--ink); background: #f6f1e2; }
  .nav-group li a.active { color: var(--green-dark); border-left-color: var(--green); background: #eef7ea; font-weight: 700; }
  .nav-group li a small { display: block; font-size: 10.5px; font-weight: 500; opacity: .8; }

  /* ---- Packet bar: who this packet is for ---- */
  .packet-bar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: #fff; border: 1.5px solid var(--line); border-radius: 14px;
    padding: 13px 18px; margin: 0 0 20px;
    font-size: 13.5px; color: var(--muted); line-height: 1.5;
  }
  .packet-bar.is-empty { border-style: dashed; }
  .packet-bar.is-set { border-color: var(--green); background: #f4faf1; }
  .packet-bar .pb-who { flex: 1; min-width: 200px; }
  .packet-bar .pb-who strong { color: var(--ink); font-size: 15px; font-weight: 800; }
  .packet-bar .pb-who small { display: block; font-size: 11.5px; margin-top: 2px; }
  .packet-bar .pb-kind {
    display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: 0.12em;
    text-transform: uppercase; padding: 3px 8px; border-radius: 999px;
    background: #eef7ea; color: var(--green-dark); margin-left: 8px; vertical-align: 2px;
  }
  .packet-bar .pb-kind.is-client { background: #fce8ef; color: #b31e48; }
  .packet-bar button {
    font-family: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer;
    border: 1.5px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 999px; padding: 8px 16px;
  }
  .packet-bar button:hover { border-color: var(--green); color: var(--green-dark); }
  .packet-bar button.pb-primary { background: var(--green); border-color: var(--green); color: #fff; }
  .packet-bar button.pb-primary:hover { background: var(--green-dark); color: #fff; }

  /* Per-form status, stamped onto the packet item rows. */
  .ob-doc .item .pb-state {
    display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: 0.1em;
    text-transform: uppercase; padding: 3px 9px; border-radius: 999px; white-space: nowrap;
    background: #f3eddd; color: var(--muted);
  }
  .ob-doc .item .pb-state.is-yes { background: #eef7ea; color: var(--green-dark); }
  .ob-doc .item .pb-state.is-na { background: #f3eddd; color: var(--muted); opacity: .7; }

  /* ---- Picker ---- */
  .pb-back {
    position: fixed; inset: 0; background: rgba(20,24,15,.45); z-index: 60;
    display: grid; place-items: center; padding: 20px;
  }
  .pb-card {
    background: #fff; border-radius: 18px; padding: 26px 28px; width: min(460px, 100%);
    max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.25);
  }
  .pb-card h3 { margin: 0 0 6px; font-size: 19px; font-weight: 800; letter-spacing: -0.01em; color: var(--ink); }
  .pb-card p.pb-lede { margin: 0 0 18px; font-size: 13px; color: var(--muted); line-height: 1.55; }
  .pb-seg { display: flex; gap: 8px; margin-bottom: 18px; }
  .pb-seg button {
    flex: 1; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
    border: 1.5px solid var(--line); background: #fff; color: var(--muted);
    border-radius: 10px; padding: 10px;
  }
  .pb-seg button[aria-pressed="true"] { border-color: var(--green); background: #eef7ea; color: var(--green-dark); }
  .pb-f { margin-bottom: 14px; }
  .pb-f label { display: block; font-size: 11px; font-weight: 800; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .pb-f select, .pb-f input {
    width: 100%; font-family: inherit; font-size: 13.5px; color: var(--ink); background: #faf7ee;
    border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; outline: none;
  }
  .pb-f select:focus, .pb-f input:focus { border-color: var(--green); background: #fff; }
  .pb-or { text-align: center; font-size: 11px; font-weight: 800; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--muted); margin: 4px 0 14px; }
  .pb-foot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .pb-err { font-size: 12.5px; font-weight: 700; color: #b0483f; margin: 0 0 12px; }
  .pb-note { font-size: 12px; color: var(--muted); line-height: 1.5; margin: 14px 0 0;
    border-top: 1px solid var(--line); padding-top: 12px; }

  @media print { .packet-bar button, .pb-back { display: none !important; } }

  /* ---- Actions ---- */
  .pol-actions { display: flex; gap: 10px; margin: 0 0 16px; flex-wrap: wrap; align-items: center; }
  .pol-actions[hidden] { display: none; }
  .pol-actions .iconbtn {
    font-family: inherit; cursor: pointer;
    width: 40px; height: 40px; border-radius: 999px; padding: 0;
    border: 1.5px solid var(--line); background: #fff; color: var(--ink);
    display: grid; place-items: center;
  }
  .pol-actions .iconbtn:hover { border-color: var(--green); color: var(--green-dark); }
  .pol-actions .iconbtn svg { width: 17px; height: 17px; }

  /* ---- Reader pane ---- */
  article.ob-doc { background: #fff; border: 1.5px solid var(--line); border-radius: 18px; padding: 34px 40px 34px; min-height: 420px; min-width: 0; }
  article.ob-doc .page-head h1 { font-size: 24px; }
  article.ob-doc .page-back { display: none; }
  article.ob-doc .sect:first-child, article.ob-doc .page-head { margin-top: 0; }
  .ob-loading { color: var(--muted); font-size: 13.5px; padding: 30px 0; }

  /* ---- Cover ---- */
  .ob-cover .kicker { font-size: 11.5px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--green); margin-bottom: 6px; }
  .ob-cover h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 10px; }
  .ob-cover p.lede { font-size: 14.5px; color: var(--muted); line-height: 1.6; max-width: 560px; }
  .ob-cover .toc { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 26px; }
  .ob-cover .toc a {
    display: flex; align-items: center; gap: 12px;
    border: 1.5px solid var(--line); border-radius: 12px; padding: 13px 15px;
    text-decoration: none; color: var(--ink); font-size: 13px; font-weight: 700;
  }
  .ob-cover .toc a:hover { border-color: var(--green); }
  .ob-cover .toc .lv {
    width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
    display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #fff;
  }
  .ob-cover .toc small { display: block; color: var(--muted); font-weight: 500; font-size: 11.5px; }

  .mob-nav-btn { display: none; }

  @media (max-width: 900px) {
    .manual { grid-template-columns: 1fr; }
    .nav-tree { position: static; max-height: none; display: none; }
    .manual.nav-open .nav-tree { display: block; }
    .mob-nav-btn {
      display: inline-flex; align-items: center; gap: 7px; margin-bottom: 14px;
      font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
      border-radius: 999px; padding: 9px 16px; border: 1.5px solid var(--line); background: #fff; color: var(--ink);
    }
    article.ob-doc { padding: 26px 22px; }
    .ob-cover .toc { grid-template-columns: 1fr; }
  }

  @media screen {
    html[data-theme="dark"] .nav-tree { background: #1d2316; }
    html[data-theme="dark"] .nav-group li a:hover { background: #232b1a; }
    html[data-theme="dark"] .nav-group li a.active { background: rgba(76,194,91,.14); }
    html[data-theme="dark"] .mob-nav-btn { background: #1d2316; color: var(--ink); }
    html[data-theme="dark"] .pol-actions .iconbtn { background: #1d2316; }
    html[data-theme="dark"] article.ob-doc { background: transparent; }
  }

  @media print {
    .topbar, .pol-actions, .portal-foot, .nav-tree, .mob-nav-btn { display: none !important; }
    body { background: #fff; }
    .wrap { padding: 0; max-width: 100%; }
    .manual { display: block; }
    article.ob-doc { border: none; border-radius: 0; padding: 0; }
  }
</style>
</head>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">
      <img src="noor-mark.png" alt="Noor Therapy Center"/>
      <span class="t"><strong>Noor Therapy Center</strong><span>Admin Portal</span></span>
    </a>
    <nav>
      <a href="tracker.html">Tracker</a>
      <a href="forms.html">Forms</a>
      <a href="policies.html">Policies</a>
      <a href="handbook.html">Handbook</a>
      <a href="onboarding.html" class="active">Onboarding</a>
      <a href="links.html">Links</a>
    </nav>
    <button class="lock" type="button">Lock</button>
  </div>
</header>

<main class="wrap" style="padding-top:30px">
  <button class="mob-nav-btn" type="button" id="mob-nav">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"></path></svg>
    Browse onboarding
  </button>

  <!-- Who this packet is for. Everything below fills in against this person. -->
  <div class="packet-bar" id="packet-bar"></div>

  <div class="manual" id="manual">
    <aside class="nav-tree" id="nav-tree" data-screen-label="Onboarding nav tree">
      <div id="tree"></div>
    </aside>

    <section id="pane" data-screen-label="Onboarding content">
      <div class="pol-actions" id="ob-actions" hidden>
        <button type="button" class="iconbtn" id="ob-home" title="Onboarding home" aria-label="Onboarding home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
        </button>
        <span style="flex:1"></span>
        <button type="button" class="iconbtn" onclick="window.print()" title="Print / Save as PDF" aria-label="Print or save as PDF">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"></path><path d="M6 18H4.5A2.5 2.5 0 0 1 2 15.5v-4A2.5 2.5 0 0 1 4.5 9h15A2.5 2.5 0 0 1 22 11.5v4a2.5 2.5 0 0 1-2.5 2.5H18"></path><rect x="6" y="14" width="12" height="8" rx="1"></rect></svg>
        </button>

<footer class="portal-foot">
  <span class="dots">
    <span style="background:#2aa63a"></span><span style="background:#f18a2c"></span><span style="background:#2f6fd6"></span><span style="background:#9b51c7"></span><span style="background:#e5396a"></span>
  </span>
  <span>Noor Therapy Center · Admin Portal · Internal use only</span>
</footer>

<script>
(function () {
  var GROUPS = [
    { name: "Clients", color: "#2f6fd6", items: [
      ["CL", "Client Onboarding", "The full intake packet, in order", "onboarding-clients.html", "clients", "#2f6fd6"]
    ]},
    { name: "Staff", color: "#2aa63a", items: [
      ["QSP", "QSP / BCBA", "Qualified Supervising Professional", "onboarding-qsp.html", "qsp", "#1f8a2e"],
      ["L1", "Level I Provider", "Advanced provider", "onboarding-level1.html", "level-1", "#2aa63a"],
      ["L2", "Level II Provider", "Behavior technician", "onboarding-level2.html", "level-2", "#f18a2c"],
      ["L3", "Level III Provider", "Behavior technician", "onboarding-level3.html", "level-3", "#9b51c7"]
    ]}
  ];

  var tree = document.getElementById("tree");
  var content = document.getElementById("content");
  var actions = document.getElementById("ob-actions");
  var manual = document.getElementById("manual");
  var cache = {};
  var current = "";
  var bySlug = {};
  GROUPS.forEach(function (g) { g.items.forEach(function (it) { bySlug[it[4]] = it; }); });

  /* Build tree: Clients group + Staff group that expands into provider levels */
  GROUPS.forEach(function (g) {
    var div = document.createElement("div");
    div.className = "nav-group open";
    var btn = document.createElement("button");
    btn.type = "button";
    btn.innerHTML = '<span class="dot" style="background:' + g.color + '"></span>' + g.name +
      '<svg class="chev" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg>';
    btn.addEventListener("click", function () { div.classList.toggle("open"); });
    var ul = document.createElement("ul");
    g.items.forEach(function (it) {
      var li = document.createElement("li");
      var a = document.createElement("a");
      a.href = "#" + it[4];
      a.innerHTML = '<span class="num">' + it[0] + '</span><span>' + it[1] + '<small>' + it[2] + "</small></span>";
      li.appendChild(a);
      ul.appendChild(li);
    });
    div.appendChild(btn);
    div.appendChild(ul);
    tree.appendChild(div);
  });

  function setActive(s) {
    tree.querySelectorAll("a").forEach(function (a) {
      var hit = a.getAttribute("href") === "#" + s;
      a.classList.toggle("active", hit);
      if (hit) {
        var grp = a.closest(".nav-group");
        if (grp) grp.classList.add("open");
      }
    });
  }

  function showCover() {
    current = "";
    actions.hidden = true;
    setActive("");
    var toc = "";
    GROUPS.forEach(function (g) {
      g.items.forEach(function (it) {
        toc += '<a href="#' + it[4] + '"><span class="lv" style="background:' + it[5] + '">' + it[0] + '</span><span>' + it[1] +
          "<small>" + it[2] + "</small></span></a>";
      });
    });
    content.innerHTML =
      '<div class="ob-cover">' +
      '<div class="kicker">Onboarding</div>' +
      "<h1>Onboarding</h1>" +
      '<p class="lede">Two tracks: bringing a new <strong>client</strong> into services, and bringing a new <strong>staff member</strong> on board at the right EIDBI provider level. Pick a track on the left \u2014 staff expands into provider levels.</p>' +
      '<div class="toc">' + toc + "</div></div>";
  }

  function showPage(s) {
    var it = bySlug[s];
    if (!it) { showCover(); return; }
    current = s;
    setActive(s);
    manual.classList.remove("nav-open");
    actions.hidden = false;
    if (cache[s]) { content.innerHTML = cache[s]; return; }
    content.innerHTML = '<div class="ob-loading">Loading\u2026</div>';
    fetch(it[3])
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (html) {
        var doc = new DOMParser().parseFromString(html, "text/html");
        var main = doc.querySelector("main.wrap");
        if (main) {
          var back = main.querySelector(".page-back");
          if (back) back.remove();
          cache[s] = main.innerHTML;
        } else {
          cache[s] = "<p>Could not load this page.</p>";
        }
        if (current === s) content.innerHTML = cache[s];
      })
      .catch(function () {
        content.innerHTML = '<p style="font-size:13.5px">Could not load this page. <a href="' + it[3] + '">Open it directly</a>.</p>';
      });
  }

  function route() {
    var s = location.hash.replace(/^#/, "");
    if (s && bySlug[s]) { showPage(s); window.scrollTo(0, 0); }
    else showCover();
  }
  window.addEventListener("hashchange", route);
  route();

  document.getElementById("ob-home").addEventListener("click", function () {
    if (location.hash) location.hash = "";
    else showCover();
  });
  document.getElementById("mob-nav").addEventListener("click", function () {
    manual.classList.toggle("nav-open");
  });
})();
</script>

<script src="/packet.js"></script>
<script>
/* Packet context: the person this onboarding run is for.
 *
 * The choice is stored once (localStorage, via /packet.js) rather than passed
 * through every link, because the fillable forms open as their own pages and
 * would otherwise each need the id threaded onto their URL. Each packet item
 * is stamped with whether that document is already on file, so the packet
 * doubles as the progress view instead of needing to be cross-checked against
 * the tracker by hand.
 */
(function () {
  "use strict";
  if (!window.NoorPacket) return;

  var P = window.NoorPacket;
  var bar = document.getElementById("packet-bar");
  var content = document.getElementById("content");
  if (!bar || !content) return;

  var STATE_LABEL = { yes: "On file", na: "N/A", none: "Outstanding" };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ---- the bar ---- */

  function paintBar() {
    var p = P.get();
    if (!p) {
      bar.className = "packet-bar is-empty";
      bar.innerHTML =
        '<span class="pb-who">This packet is not linked to anyone yet.' +
        "<small>Link it to a staff member or client and completed forms file themselves.</small></span>" +
        '<button type="button" class="pb-primary" id="pb-pick">Choose someone</button>';
    } else {
      var kind = p.kind === "client" ? "client" : "staff";
      bar.className = "packet-bar is-set";
      bar.innerHTML =
        '<span class="pb-who"><strong>' + esc(p.name || "Unnamed") + "</strong>" +
        '<span class="pb-kind' + (kind === "client" ? " is-client" : "") + '">' + kind + "</span>" +
        "<small>Completed forms file against this " + (kind === "client" ? "client" : "staff member") +
        ".</small></span>" +
        '<button type="button" id="pb-pick">Change</button>' +
        '<button type="button" id="pb-clear">Unlink</button>';
    }
    paintItems();
  }

  /* ---- per-item status ---- */

  function paintItems() {
    var p = P.get();
    content.querySelectorAll(".item").forEach(function (row) {
      var old = row.querySelector(".pb-state");
      if (old) old.remove();
      if (!p) return;

      var link = row.querySelector('a[href*="Fillable Forms/"]');
      if (!link) return;
      var file = decodeURIComponent((link.getAttribute("href") || "").split("/").pop() || "")
        .replace(/\.html?$/i, "");
      var info = P.FORMS[file];
      // Only stamp forms that belong to the kind of person this packet is for.
      if (!info || info.kind !== p.kind) return;

      var st = P.docStatus(p.kind, p.id, info.doc);
      var tag = document.createElement("span");
      tag.className = "pb-state is-" + st;
      tag.textContent = STATE_LABEL[st] || STATE_LABEL.none;
      var links = row.querySelector(".links");
      (links || row).appendChild(tag);
    });
  }

  /* ---- picker ---- */

  function openPicker() {
    var p = P.get();
    // The client track is the one page that is unambiguously about a client.
    var hint = (location.hash || "").indexOf("clients") >= 0 ? "client" : "staff";
    var kind = p ? p.kind : hint;

    var back = document.createElement("div");
    back.className = "pb-back";
    document.body.appendChild(back);

    function close() { back.remove(); document.removeEventListener("keydown", onKey); }
    function onKey(e) { if (e.key === "Escape") close(); }
    document.addEventListener("keydown", onKey);
    back.addEventListener("click", function (e) { if (e.target === back) close(); });

    function draw(list, err) {
      var opts = '<option value="">Choose…</option>';
      list.slice()
        .sort(function (a, b) { return String(a.name).localeCompare(String(b.name)); })
        .forEach(function (r) {
          opts += '<option value="' + esc(r.id) + '"' +
            (p && p.id === r.id ? " selected" : "") + ">" + esc(r.name || "Unnamed") + "</option>";
        });

      back.innerHTML =
        '<div class="pb-card" role="dialog" aria-modal="true" aria-label="Choose who this packet is for">' +
        "<h3>Who is this packet for?</h3>" +
        '<p class="pb-lede">Completed forms file themselves against this person, and each item below ' +
        "shows whether it is already on file.</p>" +
        '<div class="pb-seg">' +
          '<button type="button" data-kind="staff" aria-pressed="' + (kind === "staff") + '">Staff member</button>' +
          '<button type="button" data-kind="client" aria-pressed="' + (kind === "client") + '">Client</button>' +
        "</div>" +
        (err ? '<p class="pb-err">' + esc(err) + "</p>" : "") +
        '<div class="pb-f"><label for="pb-existing">Existing ' + (kind === "client" ? "client" : "staff") + "</label>" +
          '<select id="pb-existing">' + opts + "</select></div>" +
        '<p class="pb-or">or</p>' +
        '<div class="pb-f"><label for="pb-new">Add someone new</label>' +
          '<input type="text" id="pb-new" placeholder="Full name" autocomplete="off"/></div>' +
        (kind === "client"
          ? '<p class="pb-note"><strong>Client paperwork stays local.</strong> Client names are protected ' +
            "health information, so a client’s completed forms are recorded as done and printed — " +
            "the documents themselves are not uploaded.</p>"
          : '<p class="pb-note">Completed staff forms are saved as PDFs against this person’s ' +
            "employee file, and can be reopened from the tracker.</p>") +
        '<div class="pb-foot">' +
          '<button type="button" id="pb-cancel">Cancel</button>' +
          '<button type="button" class="pb-primary" id="pb-save">Use this packet</button>' +
        "</div></div>";

      back.querySelectorAll("[data-kind]").forEach(function (b) {
        b.addEventListener("click", function () {
          if (b.dataset.kind === kind) return;
          kind = b.dataset.kind;
          load();
        });
      });
      back.querySelector("#pb-cancel").addEventListener("click", close);
      back.querySelector("#pb-save").addEventListener("click", function () {
        var name = back.querySelector("#pb-new").value.trim();
        var chosen = back.querySelector("#pb-existing").value;
        if (name) {
          var made = P.createPerson(kind, name, kind === "staff" ? { active: true } : {});
          if (!made) return draw(list, "Could not add that person.");
        } else if (chosen) {
          var rec = null;
          list.forEach(function (r) { if (r.id === chosen) rec = r; });
          P.set(kind, chosen, rec ? rec.name : "");
        } else {
          return draw(list, "Choose someone, or type a name to add.");
        }
        close();
        paintBar();
      });

      var sel = back.querySelector("#pb-existing");
      var box = back.querySelector("#pb-new");
      // Typing a new name and picking an existing one are alternatives, so
      // each clears the other rather than silently losing to it on save.
      box.addEventListener("input", function () { if (box.value.trim()) sel.value = ""; });
      sel.addEventListener("change", function () { if (sel.value) box.value = ""; });
    }

    function load() {
      back.innerHTML = '<div class="pb-card"><p class="pb-lede">Loading…</p></div>';
      P.roster(kind).then(function (list) { draw(list || [], ""); });
    }
    load();
  }

  bar.addEventListener("click", function (e) {
    if (e.target.closest("#pb-pick")) { openPicker(); return; }
    if (e.target.closest("#pb-clear")) { P.clear(); paintBar(); return; }
  });

  // The reader pane swaps its contents on every navigation; re-stamp then.
  new MutationObserver(paintItems).observe(content, { childList: true });

  // Another tab may have changed the packet, or a form may have just filed
  // something against it.
  window.addEventListener("storage", paintBar);
  window.addEventListener("focus", paintItems);

  paintBar();
})();
</script>

</body>
</html>
